<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Smart Home - Kamery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <style>
        .camera-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .camera-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }

        .camera-card:hover {
            transform: scale(1.02);
            border-color: var(--accent);
        }

        .camera-header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body data-page="camera" data-app-title="📷 Camera">
<script>window.FEATURE_KEY = "camera";</script>

<main class="container">
    <div id="app-nav-root"></div>
    <div id="devices-loading" style="text-align: center; padding: 50px; color: var(--accent);">
        [Pobieranie danych z urządzeń...]
    </div>

    <div class="camera-container" id="camera-list">
        <!-- Kamery zostaną dodane dynamicznie -->
    </div>
</main>

<script type="module">
    async function loadDevices() {
        try {
            const response = await fetch('/api/smart-home/devices');
            const devices = await response.json();
            
            const cameraList = document.getElementById('camera-list');
            const loading = document.getElementById('devices-loading');
            
            loading.style.display = 'none';
            cameraList.innerHTML = '';

            const cameras = devices.filter(d => d.type === 'CAMERA');

            if (cameras.length === 0) {
                cameraList.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: #2a2a2a; border-radius: 8px; border: 1px dashed #444;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">📷</div>
                        <h3 style="margin: 0; color: #ccc;">Brak dostępnych kamer</h3>
                        <p style="color: #888; margin: 10px 0 0;">Wygląda na to, że żadna kamera nie jest obecnie skonfigurowana lub dostępna.</p>
                    </div>
                `;
            } else {
                cameras.forEach(cam => {
                    const card = document.createElement('div');
                    card.className = 'camera-card';
                    // Zakładamy go2rtc na porcie 1984 na tym samym host'cie co API (192.168.1.46)
                    // src=kamera_salon - nazwa z go2rtc.yaml
                    const streamName = cam.id; 
                    const host = window.location.hostname;
                    
                    card.innerHTML = `
                        <div class="camera-header">
                            <div>
                                <span style="font-weight: bold; font-size: 1.1rem;" id="label-${cam.id}">${cam.label}</span>
                                <button onclick="editLabel('${cam.id}', '${cam.label}')" style="background: none; border: none; color: #888; cursor: pointer; margin-left: 5px;">✎</button>
                                <br>
                                <small style="color: #aaa;">${cam.name}</small>
                            </div>
                            <span class="status-online" style="color: #00ff00;">● Live</span>
                        </div>
                        <div class="video-wrapper">
                            <iframe src="http://${host}:1984/webrtc.html?src=${streamName}" style="width: 100%; height: 100%; border: none;"></iframe>
                        </div>
                    `;
                    cameraList.appendChild(card);
                });
            }
        } catch (error) {
            console.error('Error loading devices:', error);
            document.getElementById('devices-loading').innerText = 'Błąd podczas ładowania urządzeń.';
        }
    }

    async function editLabel(id, currentLabel) {
        const newLabel = prompt('Podaj nową nazwę (label) dla kamery:', currentLabel);
        if (newLabel === null || newLabel === currentLabel) return;

        try {
            const response = await fetch(`/api/smart-home/cameras/${id}/label`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ label: newLabel })
            });

            if (response.ok) {
                document.getElementById(`label-${id}`).innerText = newLabel;
                // Odświeżamy atrybut onclick by zawierał nową wartość
                const btn = document.querySelector(`#label-${id} + button`);
                if (btn) btn.setAttribute('onclick', `editLabel('${id}', '${newLabel}')`);
            } else {
                alert('Błąd podczas aktualizacji nazwy.');
            }
        } catch (error) {
            console.error('Error updating label:', error);
            alert('Błąd połączenia z serwerem.');
        }
    }

    window.editLabel = editLabel;
    loadDevices();
</script>
<script type="module" src="/app.js"></script>
</body>

</html>
