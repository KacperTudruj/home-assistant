<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Smart Home - Kamery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <style>
        .camera-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .camera-card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .camera-header {
            padding: 10px 15px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sensor-panel {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .sensor-item {
            background: #3d3d3d;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .sensor-label {
            font-size: 0.8rem;
            color: #aaa;
            display: block;
        }

        .sensor-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>

<body data-page="camera">
<script>window.FEATURE_KEY = "camera";</script>

<main class="container">
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>🏠 Smart Home</h1>
        <a href="/" class="btn-secondary" style="text-decoration: none; padding: 5px 10px; background: #444; border-radius: 4px; color: white;">Powrót</a>
    </header>

    <div id="devices-loading" style="text-align: center; padding: 50px;">
        Pobieranie danych z urządzeń...
    </div>

    <div class="camera-container" id="camera-list">
        <!-- Kamery zostaną dodane dynamicznie -->
    </div>

    <h2 style="margin-top: 40px;">Sensory</h2>
    <div class="camera-container" id="sensor-list">
        <!-- Sensory zostaną dodane dynamicznie -->
    </div>
</main>

<script type="module">
    async function loadDevices() {
        try {
            const response = await fetch('/api/smart-home/devices');
            const devices = await response.json();
            
            const cameraList = document.getElementById('camera-list');
            const sensorList = document.getElementById('sensor-list');
            const loading = document.getElementById('devices-loading');
            
            loading.style.display = 'none';
            cameraList.innerHTML = '';
            sensorList.innerHTML = '';

            const cameras = devices.filter(d => d.type === 'CAMERA');
            const sensors = devices.filter(d => d.type === 'SENSOR');

            if (cameras.length === 0) {
                cameraList.innerHTML = '<p>Brak dostępnych kamer.</p>';
            } else {
                cameras.forEach(cam => {
                    const card = document.createElement('div');
                    card.className = 'camera-card';
                    // Zakładamy go2rtc na porcie 1984 na tym samym host'cie co API (192.168.1.46)
                    // src=kamera_salon - nazwa z go2rtc.yaml
                    const streamName = cam.name.toLowerCase().includes('salon') ? 'kamera_salon' : 'kamera_salon'; 
                    
                    card.innerHTML = `
                        <div class="camera-header">
                            <span>${cam.name}</span>
                            <span class="status-online" style="color: #00ff00;">● Live</span>
                        </div>
                        <div class="video-wrapper">
                            <video src="http://192.168.1.46:1984/api/stream.mp4?src=${streamName}" autoplay muted controls playsinline></video>
                        </div>
                    `;
                    cameraList.appendChild(card);
                });
            }

            if (sensors.length === 0) {
                sensorList.innerHTML = '<p>Brak dostępnych sensorów.</p>';
            } else {
                sensors.forEach(sensor => {
                    const item = document.createElement('div');
                    item.className = 'camera-card';
                    item.style.padding = '15px';
                    item.innerHTML = `
                        <div class="sensor-label">${sensor.name}</div>
                        <div class="sensor-value">${sensor.value} ${sensor.unit || ''}</div>
                    `;
                    sensorList.appendChild(item);
                });
            }
        } catch (error) {
            console.error('Error loading devices:', error);
            document.getElementById('devices-loading').innerText = 'Błąd podczas ładowania urządzeń.';
        }
    }

    loadDevices();
</script>
</body>

</html>
